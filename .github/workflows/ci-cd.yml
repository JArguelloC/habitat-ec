name: Hábitat EC — CI/CD Pipeline (Backend & Frontend SPA)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-and-build-backend:
    name: Backend (Lint, Unit, E2E, Pact & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm install

      # 1. LINT (Análisis estático de código - Falla primero ante errores de sintaxis)
      - name: 1. Run Backend Lint (Static Analysis)
        run: npm run lint

      # 2. PRUEBAS UNITARIAS (Lógica de controladores y servicios aislada)
      - name: 2. Run Backend Unit Tests
        run: npm run test

      # 3. PRUEBAS E2E (End-to-End integration tests)
      - name: 3. Run Backend E2E Tests
        run: npm run test:e2e

      # 4. VERIFICACIÓN DE CONTRATO PACT (Consumer-Driven Contract Testing)
      - name: 4. Run Pact Contract Verification
        run: npm run test:pact

      # 5. BUILD (Solo se compila si los 4 filtros de calidad anteriores pasaron)
      - name: 5. Build NestJS Production Bundle
        run: npm run build

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            ./backend/dist
            ./backend/package.json
            ./backend/package-lock.json
            ./backend/proto
            ./backend/src/graphql/schema.graphql

  validate-and-build-frontend:
    name: Frontend SPA (ESLint + TypeScript + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run ESLint Static Analysis
        run: npm run lint

      - name: Build Vite Production SPA Bundle
        run: npm run build

  deploy-backend:
    name: Deploy Backend to Azure Web App
    needs: validate-and-build-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: ./release

      - name: Install Production Dependencies
        working-directory: ./release
        run: npm ci --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'habitat-ec-backend'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./release
