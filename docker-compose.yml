version: '3.9'

services:
  habitat-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habitat-ec-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '3000:3000'
    networks:
      - habitat-net

  habitat-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: habitat-ec-frontend
    restart: unless-stopped
    depends_on:
      - habitat-backend
    ports:
      - '8080:80'
    networks:
      - habitat-net

networks:
  habitat-net:
    driver: bridge

